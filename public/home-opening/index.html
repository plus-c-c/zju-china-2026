<script>
(() => {
 const stage=document.querySelector('#stage');
 const player=document.querySelector('.player');
 const duration=16750;
 let tracks=[],clock,done=false,rate=1,ready=false,started=false,revealed=false;
 const send=type=>parent.postMessage({source:'nest-opening',type},location.origin);
 window.addEventListener('message',event=>{
  if(event.source!==parent||event.origin!==location.origin||event.data?.source!=='nest-home')return;
  if(event.data.type==='start')start();
  if(event.data.type==='speed'&&!done){rate=Math.max(1,Math.min(2,event.data.rate||1));tracks.forEach(a=>a.updatePlaybackRate(rate));}
 });
 function start(){
  if(!ready||started)return;
  started=true;
  player.removeAttribute('data-loading');
  tracks.forEach(a=>{a.playbackRate=rate;a.play();a.startTime=document.timeline.currentTime;});
  send('playing');
  const tick=()=>{
   // Reveal the homepage when the updated curing instrument has left (16.75 s).
   if(!revealed && Number(clock?.currentTime)>=16750){revealed=true;send('complete');}
   if(Number(clock?.currentTime)>=duration){
    done=true;tracks.forEach(a=>{a.pause();a.currentTime=duration;});if(!revealed)send('complete');return;
   }
   requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
 }
 Promise.all([...document.images].map(image=>image.decode().catch(()=>{}))).then(()=>{
  tracks=stage.getAnimations({subtree:true});
  clock=tracks.find(a=>a.effect?.getTiming().duration===18000);
  tracks.forEach(a=>{a.pause();a.currentTime=0;});
  ready=true;
  send('ready');
 });
})();
