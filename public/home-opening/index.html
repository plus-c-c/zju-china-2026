*{box-sizing:border-box}html{background:transparent}body{margin:0;min-height:100svh;display:grid;place-items:center;background:transparent}

.gel-delivery{position:absolute;inset:0;animation-name:gel-delivery;pointer-events:none}

.player[data-loading] *{animation-play-state:paused}
.controls{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 20px;min-height:72px;background:transparent}

<script>
(() => {
 const stage=document.querySelector('#stage');
 const player=document.querySelector('.player');
 const viewport=stage.closest('.viewport');
 const mobileLayout=window.matchMedia('(max-width:991.98px)');
 const fitStage=()=>{
  const width=viewport.clientWidth,height=viewport.clientHeight;
  // Preserve desktop framing; phones must fit both axes, including landscape.
  const scale=mobileLayout.matches
   ? Math.min(Math.max(1,width-24)/1280,Math.max(1,height-32)/720)
   : height/720;
  stage.style.setProperty('--stage-scale',String(scale));
  if(mobileLayout.matches){
   // Bone pixels occupy x=367..973, y=0..720 in the source layer.
   // Enlarge the joint to about 82% of the phone width. Reserve 8px at
   // each side for the instruments; short landscapes still cap height.
   const clinicalScale=Math.min(width*.82/606,Math.max(1,width-16)/704,Math.max(1,height-32)*.84/720);
   stage.style.setProperty('--clinical-zoom',String(clinicalScale/scale));
  }
 };
 new ResizeObserver(fitStage).observe(viewport);
 fitStage();
 const duration=16750;
 const baseRate=1.08;
 let tracks=[],clock,done=false,rate=baseRate,ready=false,started=false;
 const send=type=>parent.postMessage({source:'nest-opening',type},location.origin);
 window.addEventListener('message',event=>{
  if(event.source!==parent||event.origin!==location.origin||event.data?.source!=='nest-home')return;
  if(event.data.type==='status'&&ready)send('ready');
  if(event.data.type==='start')start();
  if(event.data.type==='finish')finish();
  if(event.data.type==='speed'&&!done){rate=Math.max(baseRate,Math.min(2,(event.data.rate||1)*baseRate));tracks.forEach(a=>a.updatePlaybackRate(rate));}
 });
 function finish(){
  if(!ready||done)return;
  started=true;
  done=true;
  player.removeAttribute('data-loading');
  tracks.forEach(a=>{a.pause();a.currentTime=duration;});
  requestAnimationFrame(()=>send('complete'));
 }
 function start(){
  if(!ready||started)return;
  started=true;
  player.removeAttribute('data-loading');
  tracks.forEach(a=>{a.playbackRate=rate;a.play();a.startTime=document.timeline.currentTime;});
  send('playing');
  const tick=()=>{
   if(done)return;
   // Hold the same final pose for both a completed opening and a return visit.
   if(Number(clock?.currentTime)>=duration){finish();return;}
   requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
 }
 async function decodeImage(image){
  try{await image.decode();}
  catch{
   // Retry a failed mobile layer before starting; a missing needle must not be
   // treated as a successfully loaded frame on a slow connection.
   if(mobileLayout.matches&&!image.naturalWidth){
    image.src=image.currentSrc||image.src;
    try{await image.decode();}catch{/* Other loaded layers can still play. */}
   }
  }
 }
 const decodedSources=new Set();Promise.all([...document.images].filter(image=>{const key=image.currentSrc||image.src;if(decodedSources.has(key))return false;decodedSources.add(key);return true;}).map(decodeImage)).then(()=>{
  tracks=stage.getAnimations({subtree:true});
  clock=tracks.find(a=>a.effect?.getTiming().duration===18000);
  tracks.forEach(a=>{a.pause();a.currentTime=0;});
  ready=true;
  send('ready');
 });
})();
